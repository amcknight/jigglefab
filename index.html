<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>JiggleFab P1</title>
    <link data-trunk rel="rust" data-target-name="jigglefab" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0d0d12;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            color: #ccc;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
        }
        #fallback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        #fallback a { color: #8af; }
        #hud {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 6px;
            font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #d8d8e0;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            z-index: 10;
        }
        #hud .lbl { color: #888; }
        #hud .v { color: #fff; }
        #hud .warn { color: #f88; }
        #hud .ok { color: #8f8; }
        #hud[data-collapsed="true"] .body { display: none; }
        #hud .toggle {
            cursor: pointer;
            color: #888;
            float: right;
            margin-left: 8px;
        }
        #picker {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100vw - 16px);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 10px;
            font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            z-index: 10;
            justify-content: center;
        }
        #picker .group-label {
            color: #888;
            padding: 4px 6px;
            align-self: center;
        }
        #picker a {
            color: #cfd;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        #picker a:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        #picker a.active {
            background: #2a4d3a;
            color: #fff;
            border-color: #4a8;
        }
        #picker a .beads {
            color: #999;
            font-size: 10px;
            margin-left: 4px;
        }
        #picker a.active .beads { color: #cee; }
        #speed-picker {
            position: absolute;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100vw - 16px);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 10px;
            font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            z-index: 10;
            justify-content: center;
        }
        #speed-picker .group-label {
            color: #888;
            padding: 4px 6px;
            align-self: center;
        }
        #speed-picker a {
            color: #cfd;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid transparent;
            white-space: nowrap;
            cursor: pointer;
        }
        #speed-picker a:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        #speed-picker a.active {
            background: #2a4d3a;
            color: #fff;
            border-color: #4a8;
        }
        #editor-toolbar {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 10px;
            font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            z-index: 10;
        }
        #editor-toolbar .row { display: flex; gap: 4px; align-items: center; }
        #editor-toolbar .group-label { color: #888; padding: 4px 6px; width: 70px; }
        #editor-toolbar a {
            color: #cfd;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid transparent;
            cursor: pointer;
        }
        #editor-toolbar a:hover { background: rgba(255, 255, 255, 0.12); }
        #editor-toolbar a.active { background: #2a4d3a; color: #fff; border-color: #4a8; }
        #editor-toolbar a.state-pill .dot {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="fallback">
        <h2>JiggleFab P1</h2>
        <p>Loading… if nothing appears within a few seconds, your browser may not support WebGPU.</p>
        <p>Tested on Chrome / Edge desktop (113+), Chrome Android (121+), Safari iOS 18+.</p>
    </div>
    <div id="hud">
        <span class="toggle" id="hud-toggle">[hide]</span>
        <div class="body">
            <div><span class="lbl">fab </span><span class="v" id="hud-fab">—</span></div>
            <div><span class="lbl">beads </span><span class="v" id="hud-beads">—</span></div>
            <div><span class="lbl">fps </span><span class="v" id="hud-fps">—</span></div>
            <div><span class="lbl">frame </span><span class="v" id="hud-frame">—</span><span class="lbl"> ms</span></div>
            <div><span class="lbl">|v| </span><span class="v" id="hud-vmin">—</span><span class="lbl"> / </span><span class="v" id="hud-vmean">—</span><span class="lbl"> / </span><span class="v" id="hud-vmax">—</span><span class="lbl"> (min/mean/max)</span></div>
        </div>
    </div>
    <nav id="editor-toolbar">
        <div class="row">
            <span class="group-label">mode</span>
            <a id="btn-edit" class="mode">Edit</a>
            <a id="btn-run" class="mode">Run</a>
        </div>
        <div class="row">
            <span class="group-label">chemistry</span>
            <span id="chemistry-pills"></span>
        </div>
        <div class="row">
            <span class="group-label">state</span>
            <span id="state-pills"></span>
        </div>
    </nav>
    <nav id="speed-picker"></nav>
    <nav id="picker"></nav>
    <script>
        // Single source of truth for the fab list. Each entry has a `key`
        // (URL hash, matches pick_fab_from_url in src/app.rs), a short
        // `label` for the picker pill, a longer `name` for the HUD, the
        // bead count, and a `group` so we can section by chemistry as more
        // configs are added (wire / sem / future).
        const FABS = [
            { key: "wire-20x30",     label: "20×30",     name: "wire 20×30",                  beads: 600,   group: "wire" },
            { key: "wire-40x30",     label: "40×30",     name: "wire 40×30",                  beads: 1200,  group: "wire" },
            { key: "wire-100x30",    label: "100×30",    name: "wire 100×30",                 beads: 3000,  group: "wire" },
            { key: "wire-20x20x20",  label: "20×20×20",  name: "wire 20×20 × 20 rows",        beads: 8000,  group: "wire" },
            { key: "wire-30x30x10",  label: "30×30×10",  name: "wire 30×30 × 10 rows",        beads: 9000,  group: "wire" },
            { key: "wire-50x50x4",   label: "50×50×4",   name: "wire 50×50 × 4 rows",         beads: 10000, group: "wire" },
            { key: "wire-100x30x10", label: "100×30×10", name: "wire 100×30 × 10 rows",       beads: 30000, group: "wire" },
        ];
        const DEFAULT_KEY = "wire-20x30";
        const FABS_BY_KEY = Object.fromEntries(FABS.map(f => [f.key, f]));

        // Speed pill values. Must match ALLOWED_SPEED_STRINGS in src/speed.rs.
        // 1× is the default and styled active when no &speed= is in the hash.
        const SPEEDS = ["0.1", "0.3", "1", "3", "10", "30", "100", "300", "1000"];
        const DEFAULT_SPEED = "1";

        function parseHash() {
            // Hash format: #<fab-key>[&key=value][&key=value]...
            const raw = (location.hash || "").replace(/^#/, "");
            const segments = raw.split("&");
            const fab = segments[0] || "";
            const params = {};
            for (let i = 1; i < segments.length; i++) {
                const eq = segments[i].indexOf("=");
                if (eq > 0) params[segments[i].slice(0, eq)] = segments[i].slice(eq + 1);
            }
            return { fab, params };
        }

        function currentSpeed() {
            const { params } = parseHash();
            const s = params.speed;
            return SPEEDS.includes(s) ? s : DEFAULT_SPEED;
        }

        function buildHash(fabKey, speed) {
            // Omit &speed= when default, to keep canonical URLs clean.
            if (speed === DEFAULT_SPEED) return "#" + fabKey;
            return "#" + fabKey + "&speed=" + speed;
        }

        function currentFab() {
            const { fab } = parseHash();
            return FABS_BY_KEY[fab] || FABS_BY_KEY[DEFAULT_KEY];
        }

        function paintFabInfo() {
            const f = currentFab();
            document.getElementById("hud-fab").textContent = f.name;
            document.getElementById("hud-beads").textContent = f.beads.toLocaleString();
        }

        function paintPicker() {
            const picker = document.getElementById("picker");
            const activeKey = currentFab().key;
            const groups = {};
            for (const f of FABS) (groups[f.group] = groups[f.group] || []).push(f);
            picker.innerHTML = "";
            for (const [group, fabs] of Object.entries(groups)) {
                const groupLabel = document.createElement("span");
                groupLabel.className = "group-label";
                groupLabel.textContent = group;
                picker.appendChild(groupLabel);
                for (const f of fabs) {
                    const a = document.createElement("a");
                    a.href = "#" + f.key;
                    a.className = f.key === activeKey ? "active" : "";
                    a.innerHTML = f.label + ' <span class="beads">' + f.beads + '</span>';
                    picker.appendChild(a);
                }
            }
        }

        function paintSpeedPicker() {
            const bar = document.getElementById("speed-picker");
            const active = currentSpeed();
            bar.innerHTML = "";
            const label = document.createElement("span");
            label.className = "group-label";
            label.textContent = "speed";
            bar.appendChild(label);
            for (const s of SPEEDS) {
                const a = document.createElement("a");
                a.textContent = s + "×";
                a.className = s === active ? "active" : "";
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    selectSpeed(s);
                });
                bar.appendChild(a);
            }
        }

        function selectSpeed(s) {
            const { fab } = parseHash();
            const fabKey = fab || DEFAULT_KEY;
            const newHash = buildHash(fabKey, s);
            history.replaceState(null, "", newHash);
            paintSpeedPicker();
            if (typeof window.__jigglefabSetSpeed === "function") {
                window.__jigglefabSetSpeed(parseFloat(s));
            }
        }

        // Reload on hash change so the WASM picks up the new fab (it reads
        // the hash once at startup).
        window.addEventListener("hashchange", () => location.reload());
        paintFabInfo();
        paintPicker();
        paintSpeedPicker();

        // Sliding-window FPS over the last ~1000 ms. Reads the wasm-side
        // frame counter so the rate reflects real sim+render frames, not
        // the browser's vsync rAF tick rate (which is ~60 Hz regardless
        // of how slow the wasm work is).
        const fpsEl = document.getElementById("hud-fps");
        const frameEl = document.getElementById("hud-frame");
        const vminEl = document.getElementById("hud-vmin");
        const vmeanEl = document.getElementById("hud-vmean");
        const vmaxEl = document.getElementById("hud-vmax");
        const samples = [];
        function tick(t) {
            const fc = window.__jigglefabFrameCount ? window.__jigglefabFrameCount() : 0;
            samples.push({ t, fc });
            if (window.__jigglefabSpeedStats) {
                const [smin, smean, smax] = window.__jigglefabSpeedStats();
                vminEl.textContent = smin.toFixed(3);
                vmeanEl.textContent = smean.toFixed(3);
                vmaxEl.textContent = smax.toFixed(3);
            }
            const cutoff = t - 1000;
            while (samples.length > 1 && samples[0].t < cutoff) samples.shift();
            if (samples.length > 1) {
                const first = samples[0];
                const last = samples[samples.length - 1];
                const span = last.t - first.t;
                const frames = last.fc - first.fc;
                if (frames > 0 && span > 0) {
                    const fps = frames * 1000 / span;
                    const dt = span / frames;
                    fpsEl.textContent = fps.toFixed(1);
                    frameEl.textContent = dt.toFixed(1);
                    fpsEl.className = fps >= 55 ? "v ok" : fps >= 30 ? "v" : "v warn";
                } else {
                    // No wasm frames advanced in the window — render is
                    // stuck or below 1 fps. Show a lower bound so it's
                    // visibly different from "60 fps".
                    fpsEl.textContent = "<1";
                    frameEl.textContent = ">" + span.toFixed(0);
                    fpsEl.className = "v warn";
                }
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        // Tap/click the [hide] label to collapse the HUD to just the toggle.
        const hud = document.getElementById("hud");
        document.getElementById("hud-toggle").addEventListener("click", () => {
            const collapsed = hud.getAttribute("data-collapsed") === "true";
            hud.setAttribute("data-collapsed", collapsed ? "false" : "true");
            document.getElementById("hud-toggle").textContent = collapsed ? "[hide]" : "[show]";
        });

        // Editor toolbar wiring. Reads/writes the wasm-side state via the
        // __jigglefab* bridge installed in src/app.rs.
        const btnEdit = document.getElementById("btn-edit");
        const btnRun = document.getElementById("btn-run");
        const chemPills = document.getElementById("chemistry-pills");
        const statePills = document.getElementById("state-pills");

        let editStateIdx = 0;

        function setModeBtnActive(mode) {
            btnEdit.classList.toggle("active", mode === "edit");
            btnRun.classList.toggle("active", mode === "run");
        }

        function paintChemistryPills() {
            if (typeof window.__jigglefabGetChemistries !== "function") return;
            chemPills.innerHTML = "";
            for (const name of window.__jigglefabGetChemistries()) {
                const a = document.createElement("a");
                a.textContent = name;
                a.dataset.name = name;
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    const beads = (window.__jigglefabBeadCount && window.__jigglefabBeadCount()) || 0;
                    if (beads > 0 && !window.confirm(
                        `Switch chemistry to "${name}"? This empties ${beads} placed bead${beads === 1 ? "" : "s"}.`
                    )) return;
                    window.__jigglefabSetChemistry(name);
                    editStateIdx = 0;
                    // Repaint will happen on next refreshToolbar tick.
                });
                chemPills.appendChild(a);
            }
        }

        function paintStatePills() {
            if (typeof window.__jigglefabGetPalette !== "function") return;
            const palette = window.__jigglefabGetPalette();
            statePills.innerHTML = "";
            palette.forEach((entry, idx) => {
                const a = document.createElement("a");
                a.className = "state-pill" + (idx === editStateIdx ? " active" : "");
                const dot = document.createElement("span");
                dot.className = "dot";
                dot.style.background = `rgb(${Math.round(entry.color[0]*255)},${Math.round(entry.color[1]*255)},${Math.round(entry.color[2]*255)})`;
                a.appendChild(dot);
                a.appendChild(document.createTextNode(entry.name));
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    editStateIdx = idx;
                    window.__jigglefabSetEditState(idx);
                    paintStatePills();
                });
                statePills.appendChild(a);
            });
        }

        btnEdit.addEventListener("click", (e) => {
            e.preventDefault();
            window.__jigglefabSetMode && window.__jigglefabSetMode("edit");
        });
        btnRun.addEventListener("click", (e) => {
            e.preventDefault();
            window.__jigglefabSetMode && window.__jigglefabSetMode("run");
        });

        // Poll the wasm side once a tick to reflect mode, repaint state pills
        // when the palette changes (i.e. after chemistry switch), and keep the
        // HUD bead count in sync with edits. Cheap.
        let lastChemName = "";
        const hudBeadsEl = document.getElementById("hud-beads");
        function refreshToolbar() {
            if (typeof window.__jigglefabGetMode === "function") {
                setModeBtnActive(window.__jigglefabGetMode());
            }
            if (typeof window.__jigglefabGetPalette === "function") {
                const palette = window.__jigglefabGetPalette();
                // Cheap signature: comma-joined names. Reflows pills only when changed.
                const sig = palette.map(e => e.name).join(",");
                if (sig !== lastChemName) {
                    lastChemName = sig;
                    paintStatePills();
                }
            }
            if (typeof window.__jigglefabBeadCount === "function" && hudBeadsEl) {
                // Overrides the static count set by paintFabInfo() so edits show up.
                hudBeadsEl.textContent = window.__jigglefabBeadCount().toLocaleString();
            }
            requestAnimationFrame(refreshToolbar);
        }
        // Bridge installers fire inside `resumed`, after window creation. Wait
        // one frame so they exist before our first read.
        requestAnimationFrame(() => {
            paintChemistryPills();
            paintStatePills();
            refreshToolbar();
        });
    </script>
</body>
</html>
