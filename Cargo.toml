[package]
name = "jigglefab"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "22"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
pollster = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
