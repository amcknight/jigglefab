# Wire: bonded pair → reflect AND swap states (signal walks along the
# chain). Free pair → reflect only (chains have physical extent and don't
# pass through each other or self-collapse). Net effect:
#   • Each bonded triple acts like a flexible link.
#   • Two chains brushing each other bounce — no state mixing.
#   • A chain folding on itself bounces internally — keeps chain extent.
states = ["off", "on"]

# `off` is a quiet dim blue, `on` is a bright amber — high contrast so the
# signal is visually obvious as it walks along the chain.
colors = [
    [0.20, 0.30, 0.55],
    [1.00, 0.80, 0.25],
]

# Inside (bonded pair at |d|=R) — reflect AND swap states.
[[rule]]
states = ["off", "off"]
inside = true
action = "swap"

[[rule]]
states = ["off", "on"]
inside = true
action = "swap"

[[rule]]
states = ["on", "on"]
inside = true
action = "swap"

# Outside (free pair colliding) — reflect, but DO NOT swap states. The
# user's clarification: "wire should only swap signal between bound
# circles." So free contacts behave physically (bounce) without
# propagating signal. This is the table default — listed explicitly here
# so the chemistry is self-documenting.
[[rule]]
states = ["off", "off"]
inside = false
action = "reflect"

[[rule]]
states = ["off", "on"]
inside = false
action = "reflect"

[[rule]]
states = ["on", "on"]
inside = false
action = "reflect"
